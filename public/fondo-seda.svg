<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.55" stop-color="#f6f0e4"/>
      <stop offset="1" stop-color="#f3ecdf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99a3d" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#cf9f45" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#e8c77e" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c99a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#efe3cc" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blurS" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- pliegues de seda -->
  <path d="M-20,0 C150,42 320,56 500,48 C700,36 880,-5 1100,0 Z" fill="url(#silk)" opacity="1"/>
  <path d="M-20,0 C140,38 300,50 470,44 C640,38 800,10 960,-10 L1600,-10 L1600,160 C1350,190 1150,300 900,330 C700,355 520,300 420,250 C330,205 200,150 40,0 Z" fill="#efe2c6" opacity="0.35" filter="url(#blur)"/>
  <path d="M700,200 C900,170 1100,110 1300,50 C1450,5 1540,-15 1600,-30 L1600,110 C1450,140 1300,190 1100,230 C950,260 820,250 700,200 Z" fill="#ffffff" opacity="0.45" filter="url(#blur)"/>
  <path d="M900,200 C1100,150 1300,70 1450,20 C1520,-5 1570,-15 1600,-20" fill="none" stroke="#e2c78f" stroke-width="60" opacity="0.28" filter="url(#blur)"/>
  <!-- hilos dorados -->
  <path d="M-20,0 C140,38 300,50 470,44 C640,38 800,10 960,-10" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <path d="M-20,0 C140,38 300,50 470,44 C640,38 800,10 960,-10" fill="none" stroke="#e8c77e" stroke-width="10" opacity="0.35" filter="url(#blurS)"/>
  <path d="M980,150 C1140,110 1280,60 1400,15 C1480,-10 1540,-25 1600,-35" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <path d="M980,150 C1140,110 1280,60 1400,15 C1480,-10 1540,-25 1600,-35" fill="none" stroke="#e8c77e" stroke-width="9" opacity="0.3" filter="url(#blurS)"/>
  <path d="M1120,150 C1300,100 1450,50 1600,20" fill="none" stroke="#dcb468" stroke-width="1" opacity="0.45"/>
  <!-- luz suave inferior -->
  <ellipse cx="1350" cy="700" rx="520" ry="260" fill="#ffffff" opacity="0.35" filter="url(#blur)"/>
</svg>
